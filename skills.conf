# Skill packs installed for every agent on this machine by `pasture-skills`
# (also run by setup.sh and `pasture-update --all`), one per line:
#   GitHub repo | Claude Code plugin as name@marketplace (or -)
# A pack that ships a Claude Code plugin is installed in Claude Code as that
# plugin (its hooks and namespaced names come with it); every other agent, and
# Claude Code when the plugin is -, gets the bare skills through the `skills`
# CLI (https://github.com/vercel-labs/skills). Lines starting with # are ignored.
# The Art of Agent Skills
kinhluan/skills | kinhluan-skills@kinhluan
