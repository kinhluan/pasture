# Tools updated by `pasture-update`, one per line:
#   name | version command | update command | herdr integration (or -)
# Lines starting with # are ignored. Order = update order.
herdr  | herdr --version  | herdr update  | -
claude | claude --version | claude update | claude
codex  | codex --version  | codex update  | codex
grok   | grok --version   | grok update   | grok
agy    | agy --version    | agy update    | antigravity-cli
# Not an agent, but updated the same way: rustup comes from its own installer.
rustup | rustc --version  | rustup update | -
# Node: newest LTS through fnm, made the default (projects pin their own).
fnm    | fnm exec --using=default node --version | fnm install --lts && fnm default lts-latest | -
# Strix (AI pentest, `pasture sec pentest`): installed with `uv tool install strix-agent`.
strix  | strix --version  | uv tool upgrade strix-agent | -
