# Sapling (sl) — https://sapling-scm.com, `sl help config` for everything.
#
# Sapling runs straight inside an existing git repo or git worktree ("dotgit"
# mode): no `sl clone`, no migration. git, lazygit and starship keep working
# side by side. Two things to know:
#   - sl leaves git's HEAD detached; push a stack with `sl push --to <branch>`
#     and let the branch follow, rather than `git commit` on top of it.
#   - Identity comes from git config (user.name / user.email), so none here.
#
# A stack is a chain of small commits, one step each. The everyday loop:
#   sl commit -m "step"   sl prev / sl next   sl amend (restacks the rest)
#   sl absorb             fold working changes into the commits they belong to
#   sl stack              just this stack (alias below)
#   sl web                drag-and-drop stack UI in the browser (ISL)

[ui]
# Keep both sides and the base in conflict markers; Helix ($EDITOR) edits them.
merge = :merge3

[pager]
pager = less -FRX

[alias]
# Only the stack you are on. Plain `sl` (smartlog) shows every local branch's
# commits, which in a big repo with many old branches is a wall of history.
stack = smartlog -r "draft() & (::. + .::)" -T "{sl}"
# Jump to the ends of the stack.
top = next --top
bottom = prev --bottom
