# Language servers for the stack we actually work in.
# Check everything with: hx --health java rust starlark python markdown toml yaml
# Rust needs nothing here: Helix uses rust-analyzer (rustup component) by default.

[language-server.starpls]
command = "starpls"
args = ["server"]

[language-server.jdtls]
command = "jdtls"

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "starlark"
language-servers = ["starpls"]
# buildifier picks BUILD vs .bzl vs MODULE.bazel rules from the file name.
# Off on save: a reformat in a shared BUILD file is a noisy diff; run :format.
formatter = { command = "buildifier", args = ["-path=%{buffer_name}"] }
auto-format = false

[[language]]
name = "java"
language-servers = ["jdtls"]

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }

[[language]]
name = "markdown"
language-servers = ["marksman"]

[[language]]
name = "toml"
language-servers = ["taplo"]
auto-format = true

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]

[[language]]
name = "git-commit"
rulers = [50, 72]
